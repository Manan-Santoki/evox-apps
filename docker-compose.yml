services:
  pipeline:
    build: .
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-https://s3.msantoki.com}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-public}
      S3_PREFIX: ${S3_PREFIX:-EvolutionX/apps}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://s3.msantoki.com/public}
      KEYSTORE_B64: ${KEYSTORE_B64}
      KEYSTORE_PASSWORD: ${KEYSTORE_PASSWORD}
      KEYSTORE_ALIAS: ${KEYSTORE_ALIAS:-evox}
      CHECK_INTERVAL_HOURS: ${CHECK_INTERVAL_HOURS:-6}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      AUTO_APPROVE: ${AUTO_APPROVE:-false}
      DASHBOARD_URL: ${DASHBOARD_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - pipeline-data:/data
    deploy:
      resources:
        limits:
          memory: 6g

volumes:
  pipeline-data:
