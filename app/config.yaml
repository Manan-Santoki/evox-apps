# Apps the pipeline builds and publishes for the ROM updater.
#
# apkmirror: <developer>/<app> path on apkmirror.com
# patches:   changes from Morphe's defaults, {patch name: {enabled, options}}.
#            Everything not listed uses Morphe's default. The goal is the stock
#            look (original icon and name) with all of Morphe's in-app features.
# signers:   SHA-256 digests of the original publisher's signing certificate.
#            A downloaded APK is rejected unless one of its signers is listed.
#            Leave empty to learn it on the first run (it is logged, then pin it).

patches_repo: MorpheApp/morphe-patches
patcher_repo: MorpheApp/morphe-desktop
abi: arm64-v8a

apps:
  - id: youtube
    name: YouTube
    package: com.google.android.youtube
    apkmirror: google-inc/youtube
    patches:
      Custom branding:
        options: {appIcon: original, customName: YouTube}
    signers:
      - 3d7a1223019aa39d9ea0e3436ab7c0896bfb4fb679f4de5fe7c23f326c8f994a
      - 5aad2bee6db95d17e05a08d7d1e64c10a1511879154483916b6ae6c7fd9cb0c6

  - id: ytmusic
    name: YouTube Music
    package: com.google.android.apps.youtube.music
    apkmirror: google-inc/youtube-music
    patches:
      Custom branding:
        options: {appIcon: original, customName: YouTube Music}
    signers:
      - 6a2f65ec694a6a632acdcb5080912a565f903d4b8d83f0eb8e44fbdf2660d8e1
      - a2a1ad7ba7f41dfca4514e2afeb90691719af6d0fdbed4b09bbf0ed897701ceb

  - id: reddit
    name: Reddit
    package: com.reddit.frontpage
    apkmirror: redditinc/reddit
    signers:
      - 970b91143813b4c9d5f3634f672c9fcaa5621b4efaaedafd6c235cbbb869736f

# Not patched, mirrored as-is from their latest stable GitHub release. `asset` is a
# regex for the release file; {version} is replaced by the release tag.
mirrors:
  # Needed to sign in to the patched Google apps. The noicon build keeps it out of
  # the app drawer.
  - id: microg
    name: MicroG-RE
    repo: MorpheApp/MicroG-RE
    asset: 'microg-{version}-noicon-arm64-v8a\.apk'
    signers:
      - 0b6c9515afb195fac59601696ba0a7907a0b217ccf720b43148427ccf64343e7

  # Manager for the KernelSU-Next built into the kernel (legacy branch). The
  # kernel recognizes it by this signing key. The "spoofed" builds use a random
  # package name and are skipped.
  - id: kernelsu
    name: KernelSU Next
    repo: KernelSU-Next/KernelSU-Next
    asset: 'KernelSU_Next_v[0-9.]+_[0-9]+-release\.apk'
    signers:
      - 79e590113c4c4c0c222978e413a5faa801666957b1212a328e46c00c69821bf7
